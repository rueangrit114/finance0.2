name: Supabase keep-alive

# Supabase (free) จะ pause โปรเจกต์ถ้าไม่มี activity ~7 วัน
# workflow นี้ยิง query จริงเข้า REST API ทุก 3 วัน
on:
  schedule:
    - cron: "17 2 */3 * *"   # 02:17 UTC (09:17 เวลาไทย) ทุก 3 วันของเดือน
  workflow_dispatch: {}       # กดรันเองได้จากแท็บ Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/envelopes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/out.json
          [ "$code" = "200" ]
